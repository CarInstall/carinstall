<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarInstall Admin</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:18px;color:#111}
.box{max-width:1000px;margin:auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 5px 25px #0001}
h1{margin-top:0}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:15px}
button{cursor:pointer;background:#111;color:#fff;border:0}
button.green{background:#16a34a}
button.red{background:#dc2626}
button.gray{background:#666}
button:disabled{opacity:.55;cursor:not-allowed}
section{margin-top:20px;padding:16px;background:#f8f8f8;border-radius:14px}
#panel{display:none}
#loginResult,#result{white-space:pre-wrap;margin-top:10px;padding:10px;border-radius:9px}
.ok{background:#e9f9ee;color:#126b2c}
.err{background:#ffe8e8;color:#9b111e}
.info{background:#eef4ff;color:#214b8f}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#fff}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;font-size:14px;vertical-align:top}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-weight:bold;font-size:12px}
.active{background:#dcfce7;color:#166534}
.disabled{background:#fee2e2;color:#991b1b}
.code{font-family:monospace;font-weight:bold;white-space:nowrap}
.small{font-size:12px;color:#666;line-height:1.5}
@media(max-width:650px){
  body{padding:8px}
  .box{padding:14px;border-radius:14px}
  section{padding:12px}
  table{font-size:12px}
  th,td{padding:7px}
}
</style>
</head>

<body>
<div class="box">
<h1>🔐 CarInstall Admin</h1>

<section id="login">
  <h2>Admin Giriş</h2>
  <label>Kullanıcı adı</label>
  <input id="username" value="admin" autocomplete="username">
  <label>Şifre</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="loginBtn">Giriş Yap</button>
  <div id="loginResult"></div>
</section>

<section id="panel">
  <h2>⚙️ Aktivasyon Yönetimi</h2>

  <button id="createBtn" class="green">➕ Yeni Aktivasyon Kodu Oluştur</button>
  <button id="reloadBtn" class="gray">🔄 Listeyi Yenile</button>

  <div id="newCode"></div>
  <div id="result"></div>

  <h3>📋 Aktivasyon Kodları</h3>
  <div style="overflow:auto">
    <table>
      <thead>
        <tr>
          <th>Kod</th>
          <th>Durum</th>
          <th>Araç</th>
          <th>Android</th>
          <th>SDK</th>
          <th>IP</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="codes"></tbody>
    </table>
  </div>

  <p class="small">
    Kodlar süresizdir. İlk kullanımda araç parmak izi ile eşleştirilir.
    Devre dışı bırakılan kod tekrar etkinleştirilebilir.
  </p>
</section>
</div>

<script>
"use strict";

const API = "https://nameless-darkness-1b75.mahmutfezlek.workers.dev";
let token = "";

const $ = id => document.getElementById(id);

function show(el, message, type="info"){
  el.textContent = message || "";
  el.className = type;
}

async function request(path, options = {}, timeoutMs = 10000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const headers = Object.assign(
      {"Content-Type":"application/json"},
      options.headers || {}
    );

    if(token){
      headers.Authorization = "Bearer " + token;
    }

    const response = await fetch(API + path, {
      ...options,
      headers,
      signal: controller.signal,
      cache: "no-store"
    });

    const text = await response.text();

    let data = null;
    try {
      data = text ? JSON.parse(text) : {};
    } catch {
      data = {raw:text};
    }

    return {status:response.status, ok:response.ok, data};
  } catch(error) {
    if(error.name === "AbortError"){
      throw new Error("Sunucu yanıt vermedi. 10 saniyelik bağlantı zaman aşımı.");
    }
    throw new Error("Worker bağlantısı kurulamadı: " + (error.message || error));
  } finally {
    clearTimeout(timer);
  }
}

async function login(){
  const username = $("username").value.trim();
  const password = $("password").value;

  if(!username || !password){
    show($("loginResult"), "Kullanıcı adı ve şifre gerekli.", "err");
    return;
  }

  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "Giriş yapılıyor...";
  show($("loginResult"), "CarInstall sunucusuna bağlanılıyor...", "info");

  try {
    const r = await request("/api/login", {
      method:"POST",
      body:JSON.stringify({username, password})
    });

    if(!r.ok || !r.data || !r.data.ok){
      throw new Error(
        r.data?.error ||
        ("HTTP " + r.status + " - giriş başarısız")
      );
    }

    if(!r.data.token){
      throw new Error("Sunucudan oturum tokeni alınamadı.");
    }

    token = r.data.token;

    $("login").style.display = "none";
    $("panel").style.display = "block";
    $("password").value = "";

    show($("result"), "Giriş başarılı.", "ok");

    await loadCodes();

  } catch(error) {
    show($("loginResult"), "❌ " + (error.message || error), "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "Giriş Yap";
  }
}

async function loadCodes(){
  $("codes").innerHTML =
    '<tr><td colspan="7">⏳ Aktivasyon kodları yükleniyor...</td></tr>';

  try {
    const r = await request("/api/admin/codes");

    if(!r.ok || !r.data?.ok){
      throw new Error(
        r.data?.error ||
        ("HTTP " + r.status)
      );
    }

    const list = r.data.codes || r.data.activations || [];

    if(!list.length){
      $("codes").innerHTML =
        '<tr><td colspan="7">Henüz aktivasyon kodu yok.</td></tr>';
      return;
    }

    $("codes").innerHTML = list.map(item => {
      const code = item.code || "";
      const active =
        item.status === "active" ||
        item.enabled === true;

      const vehicle =
        item.vehicle_model ||
        (item.fingerprint ? item.fingerprint.slice(0,18) + "…" : "—");

      const android = item.android_version || "—";
      const sdk = item.sdk || "—";
      const ip = item.last_ip || item.first_ip || "—";

      return `
        <tr>
          <td class="code">${escapeHtml(code)}</td>
          <td>
            <span class="badge ${active ? "active" : "disabled"}">
              ${active ? "AKTİF" : "DEVRE DIŞI"}
            </span>
          </td>
          <td>${escapeHtml(vehicle)}</td>
          <td>${escapeHtml(android)}</td>
          <td>${escapeHtml(String(sdk))}</td>
          <td>${escapeHtml(ip)}</td>
          <td>
            <button
              class="${active ? "red" : "green"}"
              onclick="changeStatus('${encodeURIComponent(code)}','${active ? "disable" : "enable"}')">
              ${active ? "Devre Dışı" : "Etkinleştir"}
            </button>
          </td>
        </tr>
      `;
    }).join("");

  } catch(error) {
    $("codes").innerHTML =
      '<tr><td colspan="7">❌ ' +
      escapeHtml(error.message || error) +
      '</td></tr>';

    show($("result"), "Liste alınamadı: " + (error.message || error), "err");
  }
}

async function createCode(){
  const btn = $("createBtn");
  btn.disabled = true;
  btn.textContent = "Kod oluşturuluyor...";
  show($("result"), "Yeni aktivasyon kodu oluşturuluyor...", "info");

  try {
    const r = await request("/api/admin/codes", {
      method:"POST",
      body:JSON.stringify({})
    });

    if(!r.ok || !r.data?.ok){
      throw new Error(
        r.data?.error ||
        ("HTTP " + r.status)
      );
    }

    const code =
      r.data.code ||
      r.data.activation?.code ||
      "";

    if(!code){
      throw new Error("Sunucu kod oluşturdu ancak kod bilgisi dönmedi.");
    }

    $("newCode").innerHTML =
      '<div class="ok" style="margin-top:10px">' +
      '<b>Yeni Aktivasyon Kodu</b><br><br>' +
      '<span class="code" style="font-size:20px">' +
      escapeHtml(code) +
      '</span>' +
      '</div>';

    show($("result"), "Kod başarıyla oluşturuldu ve aktif.", "ok");
    await loadCodes();

  } catch(error) {
    show($("result"), "❌ " + (error.message || error), "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "➕ Yeni Aktivasyon Kodu Oluştur";
  }
}

async function changeStatus(encodedCode, action){
  const code = decodeURIComponent(encodedCode);

  const question =
    action === "disable"
      ? "Bu aktivasyon kodu devre dışı bırakılsın mı?"
      : "Bu aktivasyon kodu tekrar etkinleştirilsin mi?";

  if(!confirm(question)) return;

  show($("result"), "İşlem yapılıyor...", "info");

  try {
    const r = await request(
      "/api/admin/codes/" +
      encodeURIComponent(code) +
      "/" + action,
      {
        method:"POST",
        body:JSON.stringify({})
      }
    );

    if(!r.ok || !r.data?.ok){
      throw new Error(
        r.data?.error ||
        ("HTTP " + r.status)
      );
    }

    show(
      $("result"),
      action === "disable"
        ? "Kod devre dışı bırakıldı."
        : "Kod tekrar etkinleştirildi.",
      "ok"
    );

    await loadCodes();

  } catch(error) {
    show($("result"), "❌ " + (error.message || error), "err");
  }
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

$("loginBtn").addEventListener("click", login);
$("createBtn").addEventListener("click", createCode);
$("reloadBtn").addEventListener("click", loadCodes);

$("password").addEventListener("keydown", event => {
  if(event.key === "Enter") login();
});
</script>
</body>
</html>
