<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarInstall Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:25px;color:#111}
.box{max-width:1000px;margin:auto;background:white;padding:25px;border-radius:16px;box-shadow:0 5px 25px #0001}
h1{margin-top:0}
input,button{padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:15px}
input{width:100%;box-sizing:border-box}
button{cursor:pointer;background:#111;color:white;border:0;padding:12px 18px}
button.green{background:#16803c}
button.red{background:#b42318}
button.gray{background:#666}
section{margin-top:20px;padding:18px;background:#f8f8f8;border-radius:12px}
#panel{display:none}
#result{white-space:pre-wrap;background:#111;color:#0f0;padding:12px;border-radius:8px;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:15px;background:white}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
th{background:#eee}
.badge{padding:5px 9px;border-radius:20px;background:#ddd}
.active{background:#c9f7d5;color:#075d20}
.disabled{background:#ffd1d1;color:#8b0000}
</style>
</head>

<body>
<div class="box">

<h1>🔐 CarInstall Admin</h1>

<section id="login">
<h2>Admin Giriş</h2>

<label>Kullanıcı adı</label>
<input id="username" value="admin">

<label>Şifre</label>
<input id="password" type="password" autocomplete="current-password">

<button onclick="login()">Giriş Yap</button>

<div id="loginResult"></div>
</section>

<section id="panel">

<h2>⚙️ Aktivasyon Yönetimi</h2>

<button class="green" onclick="createCode()">➕ Yeni Aktivasyon Kodu Oluştur</button>
<button class="gray" onclick="loadCodes()">🔄 Listeyi Yenile</button>

<div id="newCode"></div>

<h2>📋 Aktivasyon Kodları</h2>

<div style="overflow:auto">
<table>
<thead>
<tr>
<th>Kod</th>
<th>Durum</th>
<th>Araç</th>
<th>Android</th>
<th>SDK</th>
<th>IP</th>
<th>İşlem</th>
</tr>
</thead>
<tbody id="codes"></tbody>
</table>
</div>

<div id="result"></div>

</section>
</div>

<script>
const API="https://nameless-darkness-1b75.mahmutfezlek.workers.dev";

let token="";

async function api(path,options={}){

  options.headers={
    ...(options.headers||{}),
    "Content-Type":"application/json"
  };

  if(token){
    options.headers.Authorization="Bearer "+token;
  }

  const r=await fetch(API+path,options);
  const text=await r.text();

  let data;
  try{
    data=JSON.parse(text);
  }catch{
    data={raw:text};
  }

  return {status:r.status,data};
}

async function login(){

  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  document.getElementById("loginResult").textContent="Giriş yapılıyor...";

  const r=await api("/api/login",{
    method:"POST",
    body:JSON.stringify({
      username,
      password
    })
  });

  if(r.status===200 && r.data.ok){

    token=r.data.token;

    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";

    document.getElementById("password").value="";

    await loadCodes();

  }else{

    document.getElementById("loginResult").textContent=
      "❌ HTTP "+r.status+"\n"+
      JSON.stringify(r.data,null,2);

  }
}

async function createCode(){

  document.getElementById("result").textContent=
    "Yeni kod oluşturuluyor...";

  const r=await api("/api/admin/codes",{
    method:"POST",
    body:JSON.stringify({})
  });

  if(r.status===200){

    const code=r.data.code || r.data.activation?.code;

    document.getElementById("newCode").innerHTML=
      "<section><h2>🎉 Yeni Aktivasyon Kodu</h2>"+
      "<div style='font-size:25px;font-weight:bold;padding:15px;background:#e9ffe9;border-radius:10px'>"+
      (code || "Kod döndürülmedi")+
      "</div></section>";

    document.getElementById("result").textContent=
      JSON.stringify(r.data,null,2);

    await loadCodes();

  }else{

    document.getElementById("result").textContent=
      "❌ HTTP "+r.status+"\n"+
      JSON.stringify(r.data,null,2);

  }
}

async function loadCodes(){

  document.getElementById("codes").innerHTML=
    "<tr><td colspan='7'>Yükleniyor...</td></tr>";

  const r=await api("/api/admin/codes");

  if(r.status!==200){

    document.getElementById("codes").innerHTML=
      "<tr><td colspan='7'>❌ HTTP "+r.status+"</td></tr>";

    document.getElementById("result").textContent=
      JSON.stringify(r.data,null,2);

    return;
  }

  const list=r.data.codes || r.data.activations || [];

  if(!list.length){

    document.getElementById("codes").innerHTML=
      "<tr><td colspan='7'>Henüz aktivasyon kodu yok.</td></tr>";

    return;
  }

  document.getElementById("codes").innerHTML=list.map(x=>{

    const active=x.status==="active";

    return `
    <tr>
      <td><b>${escapeHtml(x.code||"")}</b></td>

      <td>
        <span class="badge ${active?"active":"disabled"}">
        ${active?"AKTİF":"DEVRE DIŞI"}
        </span>
      </td>

      <td>${escapeHtml(x.vehicle_model||"-")}</td>
      <td>${escapeHtml(x.android_version||"-")}</td>
      <td>${escapeHtml(String(x.sdk||"-"))}</td>
      <td>${escapeHtml(x.last_ip||x.first_ip||"-")}</td>

      <td>
        ${
          active
          ?
          `<button class="red" onclick="changeStatus('${encodeURIComponent(x.code)}','disable')">Devre Dışı</button>`
          :
          `<button class="green" onclick="changeStatus('${encodeURIComponent(x.code)}','enable')">Etkinleştir</button>`
        }
      </td>
    </tr>
    `;

  }).join("");

}

async function changeStatus(code,action){

  const readable=decodeURIComponent(code);

  if(!confirm(
    action==="disable"
    ?"Bu aktivasyon kodu devre dışı bırakılsın mı?"
    :"Bu aktivasyon kodu tekrar etkinleştirilsin mi?"
  )) return;

  const r=await api(
    "/api/admin/codes/"+encodeURIComponent(readable)+"/"+action,
    {method:"POST",body:JSON.stringify({})}
  );

  document.getElementById("result").textContent=
    "HTTP "+r.status+"\n"+
    JSON.stringify(r.data,null,2);

  await loadCodes();
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
</script>

</body>
</html>
